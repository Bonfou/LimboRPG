site_name: Limbo RPG
theme:
  name: material
  icon:
    admonition:
      offensive: material/sword
      defensive: material/shield
      utility: material/wrench
      passive: material/puzzle
      trait: material/sd
      feature: material/cog
      dossier: material/card-account-details
  theme:
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs # Top navbar
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.integrate

toc_depth: 3

markdown_extensions:
  - attr_list
  - admonition # For Move Cards/Callouts
  - pymdownx.details # For collapsible text
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables 
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
plugins:
  - search
  - macros

extra_css:
  - stylesheets/extra.css